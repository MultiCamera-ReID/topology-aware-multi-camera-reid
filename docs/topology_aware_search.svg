<rect x="275" y="500" width="500" height="66" rx="10" ry="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="525.0" y="528.0" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Restricted candidate set — only relevant</text>
<text x="525.0" y="546.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">cameras &amp; time ranges</text>
<line x1="525" y1="466" x2="525" y2="500" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
