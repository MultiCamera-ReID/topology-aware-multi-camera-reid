<text x="927.5" y="433.5" font-size="12" fill="#7f1d1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">instead of a naive</text>
<text x="927.5" y="450.5" font-size="12" fill="#7f1d1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">full-database scan</text>
<text x="927.5" y="467.5" font-size="12" fill="#7f1d1d" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(avoided)</text>
<line x1="775" y1="433" x2="830" y2="440.0" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<rect x="275" y="600" width="500" height="66" rx="10" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="525.0" y="618.75" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Similarity search inside the restricted set</text>
<text x="525.0" y="637.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(lightweight vector index — no billion-scale</text>
<text x="525.0" y="655.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">ANN needed)</text>
