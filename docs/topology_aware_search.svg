<line x1="525" y1="666" x2="525" y2="700" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="200" y="794" width="650" height="74" rx="10" ry="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="525.0" y="826.0" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Results: campus map + timeline + occurrences +</text>
<text x="525.0" y="844.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">confidence + linked video timestamps</text>
<line x1="525" y1="760" x2="525" y2="794" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
