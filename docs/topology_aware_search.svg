<svg viewBox="0 0 1050 950" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs>
<rect width="1050" height="950" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Diagram 4 — Topology-Aware Search (Map-Constrained Retrieval)</text>
<text x="30" y="54" font-size="12.5" fill="#475569" font-family="Arial, Helvetica, sans-serif">The learned map narrows the search instead of scanning every camera in the database</text>
<rect x="40" y="80" width="430" height="80" rx="10" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="255.0" y="105.75" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Structured filters — clothing / location</text>
<text x="255.0" y="124.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">/ time-range / event — chosen from</text>
<text x="255.0" y="142.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">dropdowns (no LLM needed for V1)</text>
<rect x="580" y="80" width="430" height="80" rx="10" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="795.0" y="105.75" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Image upload (+ optional text prompt) —</text>
<text x="795.0" y="124.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">goes through the same detection/embedding</text>
<text x="795.0" y="142.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pipeline as CCTV crops</text>
<rect x="275" y="200" width="500" height="66" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="525.0" y="228.0" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Query representation (structured params and</text>
<text x="525.0" y="246.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">/ or query embedding)</text>
<line x1="255" y1="160" x2="450" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="795" y1="160" x2="550" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
