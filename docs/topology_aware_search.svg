<text x="525.0" y="346.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">timestamp for this query</text>
<line x1="525" y1="266" x2="525" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
