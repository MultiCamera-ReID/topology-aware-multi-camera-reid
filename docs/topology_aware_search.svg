<text x="525.0" y="437.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">within a plausible transition-time window from</text>
<text x="525.0" y="455.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">the anchor</text>
