<svg viewBox="0 0 1100 840" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs>
<rect width="1100" height="840" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Diagram 3 — Camera Topology: Structure &amp; Update Rules</text>
<text x="30" y="54" font-size="12.5" fill="#475569" font-family="Arial, Helvetica, sans-serif">Left: what an edge represents. Right: how (and when) an edge is allowed to change</text>
<circle cx="150" cy="130" r="36" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="150" y="135" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">C1</text>
<circle cx="350" cy="130" r="36" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="350" y="135" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">C2</text>
<circle cx="150" cy="330" r="36" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="150" y="335" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">C3</text>
<circle cx="350" cy="330" r="36" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="350" y="335" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">C4</text>
<line x1="188.0" y1="130.0" x2="312.0" y2="130.0" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<text x="250.0" y="122.0" font-size="11" fill="#0d9488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">overlap</text>
<line x1="150.0" y1="168.0" x2="150.0" y2="292.0" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
<text x="150.0" y="222.0" font-size="11" fill="#0d9488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">transition</text>
<line x1="350.0" y1="168.0" x2="350.0" y2="292.0" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350.0" y="222.0" font-size="11" fill="#0d9488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">transition</text>
<line x1="188.0" y1="330.0" x2="312.0" y2="330.0" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250.0" y="322.0" font-size="11" fill="#0d9488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">transition</text>
<rect x="20" y="420" width="460" height="190" rx="10" ry="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="250.0" y="475.0" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Edge attributes stored (e.g. C1 → C3):</text>
<text x="250.0" y="492.5" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">count, transition probability, avg / median /</text>
<text x="250.0" y="510.0" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">min / max transition time, confidence score,</text>
<text x="250.0" y="527.5" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">last-observed time, relationship type</text>
<text x="250.0" y="545.0" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(overlapping vs non-overlapping), direction</text>
<text x="250.0" y="562.5" font-size="12.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(C1→C3 ≠ C3→C1)</text>
<text x="20" y="645" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Overlap rule: C1→C2 is recorded when the person is fully</text>
<text x="20" y="663" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">gone from C1 while still present in C2 — not merely</text>
<text x="20" y="681" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">co-visible in both at once.</text>
<text x="20" y="730" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Static layer: admin-configured camera metadata,</text>
<text x="20" y="748" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">can be made permanent, with a reset-to-default option.</text>
<text x="20" y="766" font-size="12" fill="#475569" font-family="Arial, Helvetica, sans-serif">Dynamic layer: transition stats learned automatically.</text>
<rect x="520" y="60" width="420" height="64" rx="10" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="730.0" y="87.0" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">New confirmed cross-camera Re-ID</text>
<text x="730.0" y="105.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">observation</text>
<rect x="520" y="160" width="420" height="80" rx="10" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="730.0" y="185.75" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Passes confidence threshold +</text>
<text x="730.0" y="204.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">temporal + motion + quality</text>
<text x="730.0" y="222.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">checks?</text>
<line x1="730.0" y1="124" x2="730.0" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="940" y="165" width="150" height="90" rx="10" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1015.0" y="195.75" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">NO → discard. No</text>
<text x="1015.0" y="214.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">effect on the</text>
<text x="1015.0" y="232.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">topology graph.</text>
<line x1="940" y1="200" x2="940" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="948.0" y="199.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">NO</text>
<rect x="520" y="276" width="420" height="70" rx="10" ry="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="730.0" y="296.75" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Incrementally update edge count /</text>
<text x="730.0" y="315.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">probability / transition-time</text>
<text x="730.0" y="333.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">stats / confidence</text>
<line x1="730.0" y1="240" x2="730.0" y2="276" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="738.0" y="252.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">YES</text>
<rect x="520" y="382" width="420" height="60" rx="10" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="730.0" y="407.0" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Monitor confidence trend across</text>
<text x="730.0" y="425.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">recent observations</text>
<line x1="730.0" y1="346" x2="730.0" y2="382" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520" y="478" width="420" height="70" rx="10" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="730.0" y="508.0" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Trend consistently falling →</text>
<text x="730.0" y="526.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">gradually reduce edge confidence</text>
<line x1="730.0" y1="442" x2="730.0" y2="478" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="738.0" y="454.0" font-size="11" fill="#64748b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">declining</text>
<rect x="940" y="483" width="150" height="80" rx="10" ry="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="1015.0" y="508.75" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stable / rising →</text>
<text x="1015.0" y="527.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">edge stays or</text>
<text x="1015.0" y="545.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">strengthens</text>
<line x1="940" y1="412" x2="940" y2="523" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="948.0" y="461.5" font-size="11" fill="#64748b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">stable</text>
<rect x="520" y="584" width="420" height="80" rx="10" ry="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="730.0" y="609.75" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Confidence below floor → flag for</text>
<text x="730.0" y="628.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">manual verification → deactivate /</text>
<text x="730.0" y="646.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">remove edge</text>
<line x1="730.0" y1="548" x2="730.0" y2="584" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
