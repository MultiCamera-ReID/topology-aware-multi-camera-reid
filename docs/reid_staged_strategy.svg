<svg viewBox="0 0 1060 560" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs>
<rect width="1060" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0f172a" font-family="Arial, Helvetica, sans-serif">Diagram 5 — Re-ID Development Strategy &amp; V1 → V3 Roadmap</text>
<text x="30" y="54" font-size="12.5" fill="#475569" font-family="Arial, Helvetica, sans-serif">Two parallel axes: model-training maturity (top) and feature-richness of the association pipeline (bottom)</text>
<rect x="40" y="80" width="300" height="150" rx="10" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="190.0" y="122.25" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stage A — Baseline</text>
<text x="190.0" y="140.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Pretrained Re-ID model</text>
<text x="190.0" y="159.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">→ evaluate on a public</text>
<text x="190.0" y="177.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">multi-camera dataset</text>
<text x="190.0" y="196.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">→ baseline metrics</text>
<rect x="380" y="80" width="300" height="150" rx="10" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="530.0" y="131.5" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stage B — Adaptation</text>
<text x="530.0" y="150.0" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Fine-tune / domain-adapt</text>
<text x="530.0" y="168.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">→ campus-like footage</text>
<text x="530.0" y="187.0" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">→ improved representation</text>
<rect x="720" y="80" width="300" height="150" rx="10" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="870.0" y="122.25" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stage C — Contribution</text>
<text x="870.0" y="140.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Add pose + quality +</text>
<text x="870.0" y="159.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">temporal + motion + topology</text>
<text x="870.0" y="177.75" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">→ unified association</text>
<text x="870.0" y="196.25" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">→ compare vs. baseline</text>
<line x1="340" y1="155.0" x2="380" y2="155.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="155.0" x2="720" y2="155.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="256" font-size="12.5" fill="#475569" font-family="Arial, Helvetica, sans-serif">Only train a substantially new network from scratch if Stage A/B prove inadequate.</text>
<rect x="40" y="290" width="300" height="130" rx="10" ry="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="190.0" y="331.5" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">V1</text>
<text x="190.0" y="350.0" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Full-body Re-ID</text>
<text x="190.0" y="368.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">embedding only</text>
<text x="190.0" y="387.0" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(keep it simple first)</text>
<rect x="380" y="290" width="300" height="130" rx="10" ry="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="530.0" y="331.5" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">V2</text>
<text x="530.0" y="350.0" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Full-body +</text>
<text x="530.0" y="368.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">pose / body-structure</text>
<text x="530.0" y="387.0" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">representation</text>
<rect x="720" y="290" width="300" height="130" rx="10" ry="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="870.0" y="331.5" font-size="13.5" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">V3</text>
<text x="870.0" y="350.0" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Full-body + pose + quality</text>
<text x="870.0" y="368.5" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">+ temporal + topology</text>
<text x="870.0" y="387.0" font-size="13.5" font-weight="normal" fill="#1e293b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(full Unified Match Score)</text>
<line x1="340" y1="355.0" x2="380" y2="355.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="355.0" x2="720" y2="355.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="190" y1="230" x2="190" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<line x1="870" y1="230" x2="870" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
<text x="40" y="450" font-size="12.5" fill="#475569" font-family="Arial, Helvetica, sans-serif">No face recognition at any stage — faces aren't reliably visible from every camera angle.</text>
</svg>
